<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   IDGPT
  </title>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
   body {
     font-family: 'Inter', sans-serif;
   }
   .gradient-ring {
     width: 120px;
     height: 120px;
     border-radius: 9999px;
     background: conic-gradient(
       from 180deg at 50% 50%, 
       #d18de0 0deg 90deg, 
       #b87bd9 90deg 135deg, 
       #a46ad0 135deg 180deg, 
       #7f4fc3 180deg 225deg, 
       #5a3db7 225deg 270deg, 
       #3a6ee8 270deg 360deg
     );
     display: flex;
     align-items: center;
     justify-content: center;
   }
   .gradient-ring-inner {
     width: 72px;
     height: 72px;
     border-radius: 9999px;
     background-color: #121212;
   }
   /* Chat container */
   #chat-container {
     flex-grow: 1;
     overflow-y: auto;
     padding: 0 1rem;
     margin-bottom: 1rem;
     width: 100%;
     max-width: 600px;
   }
   .message {
     max-width: 80%;
     margin-bottom: 0.75rem;
     padding: 0.5rem 0.75rem;
     border-radius: 0.75rem;
     font-size: 1rem;
     line-height: 1.25rem;
     word-wrap: break-word;
     white-space: pre-wrap;
   }
   .user-message {
     background-color: #25D366;
     color: black;
     margin-left: auto;
     border-bottom-right-radius: 0.25rem;
   }
   .ai-message {
     background-color: #0088cc;
     color: white;
     margin-right: auto;
     border-bottom-left-radius: 0.25rem;
   }
  </style>
 </head>
 <body class="bg-[#121212] text-gray-300 min-h-screen flex flex-col">
  <div class="relative flex items-center justify-center pt-6 pb-2 border-b border-gray-700">
   <button aria-label="Back" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 text-2xl">
    <i class="fas fa-arrow-left">
    </i>
   </button>
   <h1 class="text-lg font-medium flex items-center space-x-1">
    <span>
     ID GPT
    </span>
    <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
     <path d="M12 0a12 12 0 1012 12A12.014 12.014 0 0012 0zm5.707 8.293l-6.364 6.364a1 1 0 01-1.414 0l-3.182-3.182a1 1 0 111.414-1.414l2.475 2.475 5.657-5.657a1 1 0 111.414 1.414z">
     </path>
    </svg>
   </h1>
  </div>
  <div class="text-center mt-1 mb-6 text-sm text-gray-500">
   dengan farel 0.0.1
  </div>
  <div class="flex-grow flex flex-col items-center justify-start px-6">
   <div class="gradient-ring mb-8" role="img" aria-label="Circular gradient ring with pink and blue colors">
    <div class="gradient-ring-inner">
    </div>
   </div>
   <h2 class="text-2xl font-normal mb-8">
    Tanya IDGPT apa saja 
   </h2>
   <div id="chat-container" class="w-full max-w-md overflow-y-auto">
    <div class="flex flex-wrap justify-center gap-2 max-w-md mb-6">
     <div class="bg-[#2a2a2a] rounded-full px-4 py-2 text-gray-400 text-sm flex items-center space-x-1">
      <span>
       📝
      </span>
      <span>
       Saya ingin ngobrol
      </span>
     </div>
     <div class="bg-[#2a2a2a] rounded-full px-4 py-2 text-gray-400 text-sm flex items-center space-x-1">
      <span>
       📝
      </span>
      <span>
       Saya butuh bantuan untuk mengumpulkan gagasan
      </span>
     </div>
     <div class="bg-[#2a2a2a] rounded-full px-4 py-2 text-gray-400 text-sm flex items-center space-x-1">
      <span>
       📝
      </span>
      <span>
       Saya ingin menayanyakan tentang IDGPT
      </span>
     </div>
    </div>
   </div>
  </div>
  <form id="chat-form" class="flex items-center px-4 py-3 border-t border-gray-700 bg-[#1f1f1f] max-w-md mx-auto w-full">
   <button aria-label="Emoji" class="text-gray-400 text-2xl mr-3" type="button">
    <i class="far fa-smile">
    </i>
   </button>
   <input autocomplete="off" id="message-input" class="flex-grow bg-[#2a2a2a] rounded-full py-2 px-4 text-gray-400 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ketik pesan" type="text" required/>
   <button aria-label="Send" class="ml-3 bg-green-600 hover:bg-green-700 rounded-full w-12 h-12 flex items-center justify-center text-white text-2xl" type="submit">
    <i class="fas fa-paper-plane">
    </i>
   </button>
  </form>
  <script>
 const chatContainer = document.getElementById('chat-container');
 const chatForm = document.getElementById('chat-form');
 const messageInput = document.getElementById('message-input');

 // Function to add message to chat container
 function addMessage(text, sender) {
   const messageDiv = document.createElement('div');
   messageDiv.classList.add('message');
   if (sender === 'user') {
     messageDiv.classList.add('user-message');
   } else {
     messageDiv.classList.add('ai-message');
   }
   messageDiv.textContent = text;
   chatContainer.appendChild(messageDiv);
   chatContainer.scrollTop = chatContainer.scrollHeight;
 }

 // Function to call your custom AI API and get response
 async function getAIResponse(message) {
  const apiUrl = `https://api.siputzx.my.id/api/ai/llama33?prompt=Be%20a%20helpful%20assistant&text=${encodeURIComponent(message)}`;

  try {
    const response = await fetch(apiUrl);
    const data = await response.json();

    if (data.status && data.data) {
      return data.data;
    } else {
      return "Maaf, AI tidak memberikan respons yang valid.";
    }
  } catch (error) {
    return `Error: ${error.message}`;
  }
}

 chatForm.addEventListener('submit', async (e) => {
   e.preventDefault();
   const userMessage = messageInput.value.trim();
   if (!userMessage) return;

   addMessage(userMessage, 'user');
   messageInput.value = '';
   messageInput.disabled = true;

   const aiReply = await getAIResponse(userMessage);
   addMessage(aiReply, 'ai');

   messageInput.disabled = false;
   messageInput.focus();
 });
</script>
 </body>
</html>
