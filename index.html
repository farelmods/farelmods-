<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat UI with AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
  body {
    font-family: 'Inter', sans-serif;
    background-color: #000000;
    color: white;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    padding: 1rem 1rem 0.5rem 1rem;
    border-bottom: 1px solid #111111;
  }
  header .title {
    font-weight: 800;
    font-size: 2.25rem;
    line-height: 2.5rem;
    max-width: 9.5rem;
    color: white;
  }
  header .title .blue-diamond {
    color: #00008b;
    font-size: 2.25rem;
    line-height: 2.5rem;
    margin-right: 0.25rem;
  }
  header button {
    margin-left: 0.75rem;
    border-radius: 0.375rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  header .btn-gpt {
    background-color: #2d2d2d;
    color: white;
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
  }
  header .btn-code {
    background-color: #c75a26;
    color: white;
    padding: 0.5rem 1rem;
    font-size: 1.125rem;
  }
  header .btn-menu {
    background-color: #8db92f;
    color: white;
    padding: 0.5rem 1rem;
    font-size: 1.125rem;
  }
  main {
    flex-grow: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .message {
    max-width: 75%;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    font-size: 1rem;
    line-height: 1.25rem;
    word-wrap: break-word;
  }
  .message.user {
    background-color: #2d2d2d;
    align-self: flex-end;
    color: white;
  }
  .message.bot {
    background-color: #1a1a1a;
    align-self: flex-start;
    color: #ccc;
  }
  footer {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    border-top: 1px solid #111111;
    background-color: #000000;
  }
  footer input[type="text"] {
    flex-grow: 1;
    background-color: #1a1a1a;
    color: #999999;
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    border: none;
    font-size: 1rem;
  }
  footer input[type="text"]::placeholder {
    color: #666666;
  }
  footer input[type="text"]:focus {
    outline: none;
  }
  footer button {
    background-color: #666666;
    color: black;
    font-weight: 700;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
 margin-left: 0.75rem;
    cursor: pointer;
    border: none;
    font-size: 1rem;
  }
  @media (min-width: 640px) {
    header .title {
      font-size: 2.5rem;
      line-height: 2.75rem;
    }
  }
  /* Styles for the menu panel */
  .menu-panel {
    position: absolute;
    top: 60px; /* Adjust based on header height */
    right: 10px;
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 0.5rem;
    display: none; /* Hidden by default */
    flex-direction: column;
    padding: 1rem;
    z-index: 1000;
  }
  .menu-panel button {
    background-color: transparent;
    color: white;
    border: none;
    padding: 0.5rem 0;
    text-align: left;
    cursor: pointer;
  }
  .menu-panel button:hover {
    background-color: #333;
  }
</style>
</head>
<body>
  <header>
    <div class="title">
      <span class="blue-diamond">♦</span> Tempat<br />bermain
    </div>
    <button class="btn-gpt">GPT4.1</button>
    <button class="btn-code">&lt;/&gt;</button>
    <button class="btn-menu" id="menuBtn"><i class="fas fa-bars"></i></button>
  </header>

  <div class="menu-panel" id="menuPanel">
    <button id="profileBtn">Profil</button>
    <button id="settingsBtn">Pengaturan</button>
    <button id="logoutBtn">Keluar</button>
  </div>

  <main id="chat">
    <!-- Messages will appear here -->
  </main>

  <footer>
    <input id="inputMessage" type="text" placeholder="Ketik pesan Anda..." autocomplete="off" />
    <button id="sendBtn">MENGIRIM</button>
  </footer>

<script>
  const chat = document.getElementById('chat');
  const inputMessage = document.getElementById('inputMessage');
  const sendBtn = document.getElementById('sendBtn');
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');

  // Function to add message to chat
  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.textContent = text;
    chat.appendChild(msgDiv);
    chat.scrollTop = chat.scrollHeight;
  }

  // Function to call OpenAI API (GPT-4.1)
  async function getAIResponse(message) {
    const apiUrl = `https://api.siputzx.my.id/api/ai/blackboxai-pro?content=${encodeURIComponent(message)}`;

    try {
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status && data.data) {
        return data.data;
      } else {
        return "Maaf, AI tidak memberikan respons yang valid.";
      }
    } catch (error) {
      return `Error: ${error.message}`;
    }
  }

  // Handle sending message
  async function sendMessage() {
    const message = inputMessage.value.trim();
    if (!message) return;

    addMessage(message, 'user');
    inputMessage.value = '';
    inputMessage.disabled = true;
    sendBtn.disabled = true;

    addMessage('...', 'bot'); // show typing indicator
    const typingMsg = chat.querySelector('.message.bot:last-child');

    const aiResponse = await getAIResponse(message);

    typingMsg.textContent = aiResponse;

    inputMessage.disabled = false;
    sendBtn.disabled = false;
    inputMessage.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputMessage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Toggle menu panel visibility
  menuBtn.addEventListener('click', () => {
    menuPanel.style.display = menuPanel.style.display === 'flex' ? 'none' : 'flex';
  });

  // Close menu panel when clicking outside
  window.addEventListener('click', (event) => {
    if (!menuPanel.contains(event.target) && event.target !== menuBtn) {
      menuPanel.style.display = 'none';
    }
  });
</script>
</body>
</html>
